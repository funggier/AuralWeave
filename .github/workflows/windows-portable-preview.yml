name: Windows portable preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    name: Compile and verify Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source, including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile native engine, test, and package portable Studio
        run: ./scripts/build-windows.ps1 -PublishPortable

      - name: Audit portable binaries and release notes
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem -LiteralPath dist -Filter 'AuralWeave-v*-Windows-x64.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one portable ZIP, found $($zips.Count)" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            foreach ($file in @('AuralWeave.exe', 'AuralWeave.Native.dll', 'RELEASE_NOTES.md')) {
              if (!$zip.GetEntry($file)) { throw "Portable ZIP is missing $file" }
            }

            $forbidden = @($zip.Entries | Where-Object { $_.FullName -match '(?i)\.(sys|inf|cat|pdb)$' })
            if ($forbidden.Count) {
              throw "Unexpected driver or debug files: $($forbidden.FullName -join ', ')"
            }

            $reader = [System.IO.StreamReader]::new($zip.GetEntry('RELEASE_NOTES.md').Open())
            try {
              $notes = $reader.ReadToEnd()
              if ($notes -notmatch 'https://vb-audio\.com/Cable/' -or
                  $notes -notmatch 'CABLE Input' -or $notes -notmatch 'CABLE Output') {
                throw 'Release notes are missing the VB-CABLE routing guide.'
              }
            }
            finally { $reader.Dispose() }
          }
          finally { $zip.Dispose() }

      - name: Publish verified Studio-only test archive
        uses: actions/upload-artifact@v4
        with:
          name: AuralWeave-Windows-x64-portable-preview
          path: dist/AuralWeave-v*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
